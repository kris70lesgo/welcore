services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: adms_dispatch
      POSTGRES_PASSWORD: adms-local-development
      POSTGRES_DB: adms_dispatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - adms_dispatch_data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adms_dispatch -d adms_dispatch"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  adms_dispatch_data:
