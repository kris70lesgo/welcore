name: adms-judge
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: adms_dispatch
      POSTGRES_DB: adms_dispatch
      POSTGRES_PASSWORD: ${ADMS_JUDGE_DB_PASSWORD:?Run scripts/run-judge.sh}
    volumes:
      - judge_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adms_dispatch -d adms_dispatch"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: backend/adms_server
    environment:
      SERVERPOD_DATABASE_PASSWORD: ${ADMS_JUDGE_DB_PASSWORD}
      SERVERPOD_SERVICE_SECRET: ${ADMS_JUDGE_SERVICE_SECRET:?Run scripts/run-judge.sh}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8182:80"
    depends_on:
      - server
    restart: unless-stopped
volumes:
  judge_database:
